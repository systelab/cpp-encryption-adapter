version: '0.0.{build}'

init:
  - ps: >-
      if($env:appveyor_repo_tag -eq 'True') {
        Update-AppveyorBuild -Version "$($env:APPVEYOR_REPO_TAG_NAME.TrimStart("v"))"
      }

configuration:
  - Debug
  - Release

environment:
  global:
    CYG_ROOT: C:\cygwin64
    CONAN_HOME: "%APPVEYOR_BUILD_FOLDER%\\.conan2"

  matrix:
  - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    arch: x86
    platform: Win32
    visual_studio: Visual Studio 17 2022

  - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    arch: x86_64
    platform: x64
    visual_studio: Visual Studio 17 2022

install:
  - "SET PATH=C:\\Python311;C:\\Python311\\Scripts;%PATH%"
  - python -m pip install "conan==2.20.0"
  - conan profile detect --force
  - conan remote add aid-conan-production-local https://systelab.jfrog.io/artifactory/api/conan/cpp-conan-production-local
  - conan --version

before_build:
  - conan export-pkg EncryptionAdapterInterface/conanfile.py --name encryption-adapter-interface --version %APPVEYOR_BUILD_VERSION% --output-folder build
  - conan install EncryptionAdapterTestUtilities --version %APPVEYOR_BUILD_VERSION% --output-folder build --profile:all default --settings:host os=Windows --settings:host arch=%ARCH% --settings:host compiler=msvc --settings:host compiler.version=194 --settings:host compiler.cppstd=20 --settings:host compiler.runtime=dynamic --settings:host build_type=%CONFIGURATION% --build=missing

build_script:
  - conan build EncryptionAdapterTestUtilities --version %APPVEYOR_BUILD_VERSION% --output-folder build --profile:all default --settings:host os=Windows --settings:host arch=%ARCH% --settings:host compiler=msvc --settings:host compiler.version=194 --settings:host compiler.cppstd=20 --settings:host compiler.runtime=dynamic --settings:host build_type=%CONFIGURATION%

after_build:
  - conan export-pkg EncryptionAdapterTestUtilities/conanfile.py --name encryption-adapter-test-utilities --version %APPVEYOR_BUILD_VERSION% --output-folder build --profile:all default --settings:host os=Windows --settings:host arch=%ARCH% --settings:host compiler=msvc --settings:host compiler.version=194 --settings:host compiler.cppstd=20 --settings:host compiler.runtime=dynamic --settings:host build_type=%CONFIGURATION%
  - conan test test_package/conanfile.py encryption-adapter-test-utilities/%APPVEYOR_BUILD_VERSION% --profile:all default --settings:host os=Windows --settings:host arch=%ARCH% --settings:host compiler=msvc --settings:host compiler.version=194 --settings:host compiler.cppstd=20 --settings:host compiler.runtime=dynamic --settings:host build_type=%CONFIGURATION%

artifacts:
  - path: 'build/lib/%CONFIGURATION%/EncryptionAdapterTestUtilities.lib'
    name: EncryptionAdapterTestUtilities.lib

deploy_script:
  - ps: >- 
      if($env:appveyor_repo_tag -eq 'True') {
        conan upload encryption-adapter-interface/$env:appveyor_build_version --remote aid-conan-production-local --confirm --force
        conan upload encryption-adapter-test-utilities/$env:appveyor_build_version --remote aid-conan-production-local --confirm --force
      } else {
        echo "Not uploading because this is not a tag build"
      }
  - '%CYG_ROOT%/bin/bash -lc "cd $APPVEYOR_BUILD_FOLDER; ./ci/build_docs.sh -o \"systelab\" -s \"cpp-encryption-adapter\" -t \"$APPVEYOR_REPO_TAG_NAME\" -c AppVeyor -n \"$APPVEYOR_BUILD_WORKER_IMAGE %PLATFORM% %CONFIGURATION%\" -j \"$APPVEYOR_JOB_ID\"'
