language: cpp

env:
  global:
    - CONAN_HOME=$HOME/.conan2/cpp-encryption-adapter

matrix:
  include:
  - os: linux
    dist: focal
    language: python
    compiler: gcc
    python: "3.10"
    addons:
      apt:
        sources:
          - ubuntu-toolchain-r-test
        packages:
          - gcc-10
          - g++-10
    env:
      - COMPILER_NAME=gcc-10
      - BUILD_TYPE=Release
      - CONAN_BUILD_TYPE=Release
      - COMPILER_LIBCXX=libstdc++11

  - os: linux
    dist: focal
    language: python
    compiler: gcc
    python: "3.10"
    addons:
      apt:
        sources:
          - ubuntu-toolchain-r-test
        packages:
          - gcc-10
          - g++-10
    env:
      - COMPILER_NAME=gcc-10
      - BUILD_TYPE=Debug
      - CONAN_BUILD_TYPE=Debug
      - COMPILER_LIBCXX=libstdc++11

  - os: osx
    osx_image: xcode12.2
    compiler: clang   
    env:
      - COMPILER_NAME=clang-MacOS
      - BUILD_TYPE=Release
      - CONAN_BUILD_TYPE=Release
      - COMPILER_LIBCXX=libc++
      - HOMEBREW_NO_AUTO_UPDATE=1
    cache:
      directories:
        - $HOME/Library/Caches/Homebrew
        - /usr/local/Homebrew

install: 
  - if [ $TRAVIS_OS_NAME == linux ]; then sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 90; fi
  - if [ $TRAVIS_OS_NAME == linux ]; then sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 90; fi
  - python3 -m pip install "conan==2.20.0" "cmake>=3.15"
  - conan remote add aid-conan-production-local https://systelab.jfrog.io/artifactory/api/conan/cpp-conan-production-local
  - conan profile detect --force
  - conan --version

script:
  - g++ --version
  - mkdir -p build
  - |
    if [ -n "$TRAVIS_TAG" ]; then
      conan export-pkg EncryptionAdapterInterface/conanfile.py --name encryption-adapter-interface --version "${TRAVIS_TAG:1}" --output-folder build/interface --force;
    else
      conan export-pkg EncryptionAdapterInterface/conanfile.py --name encryption-adapter-interface --version "0.0.${TRAVIS_BUILD_NUMBER}" --output-folder build/interface --force;
    fi
  - cd build
  - |
    if [ -n "$TRAVIS_TAG" ]; then
      conan install ../EncryptionAdapterTestUtilities --version "${TRAVIS_TAG:1}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20 --build=missing;
      conan build ../EncryptionAdapterTestUtilities --version "${TRAVIS_TAG:1}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20;
    else
      conan install ../EncryptionAdapterTestUtilities --version "0.0.${TRAVIS_BUILD_NUMBER}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20 --build=missing;
      conan build ../EncryptionAdapterTestUtilities --version "0.0.${TRAVIS_BUILD_NUMBER}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20;
    fi
  - |
    if [ -n "$TRAVIS_TAG" ]; then
      conan export-pkg ../EncryptionAdapterTestUtilities/conanfile.py --name encryption-adapter-test-utilities --version "${TRAVIS_TAG:1}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20 --force;
    else
      conan export-pkg ../EncryptionAdapterTestUtilities/conanfile.py --name encryption-adapter-test-utilities --version "0.0.${TRAVIS_BUILD_NUMBER}" --output-folder . --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20 --force;
    fi
  - |
    if [ "$BUILD_TYPE" == "Release" ] || [ "$BUILD_TYPE" == "Debug" ]; then
      if [ -n "$TRAVIS_TAG" ]; then
        conan test ../test_package/conanfile.py encryption-adapter-test-utilities/${TRAVIS_TAG:1} --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20;
      else
        conan test ../test_package/conanfile.py encryption-adapter-test-utilities/0.0.${TRAVIS_BUILD_NUMBER} --profile:all default --settings:host build_type=${CONAN_BUILD_TYPE} --settings:host compiler.libcxx=${COMPILER_LIBCXX} --settings:host compiler.cppstd=20;
      fi
    fi
  - cd ..

deploy:
  - provider: script
    skip_cleanup: true
    script: bash ./ci/deploy.sh -v "${TRAVIS_TAG:1}"
    on:
      tags: true
  - provider: script
    script: bash ./ci/build_docs.sh -o "systelab" -s "cpp-encryption-adapter" -t "${TRAVIS_TAG}" -c "Travis" -n "${COMPILER_NAME} ${BUILD_TYPE}" -j "${TRAVIS_JOB_ID}"
    skip_cleanup: true
    on:
      tags: true
